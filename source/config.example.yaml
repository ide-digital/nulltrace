# Copy to %AppData%\nulltrace\config.yaml (Windows) or ~/.config/nulltrace/config.yaml.
# Mailbox passwords and API keys belong in the vault (`nulltrace secret set`), not here.

listen_addr: 127.0.0.1:7738
jurisdiction: CCPA

smtp:
  port: 587
  starttls: true

imap:
  port: 993
  mailbox: INBOX
  tls: true
  auto_fetch: false

hibp:
  enabled: true
  api_base: https://haveibeenpwned.com/api/v3

browser:
  enabled: false
  headless: true
  stealth: true
  timeout_seconds: 45

capsolver:
  enabled: false
  api_base: https://api.capsolver.com
  timeout_seconds: 60

footprint:
  enabled: true
  max_concurrent: 8
  timeout_seconds: 15

scheduler:
  repopulation_days: 45

mailer:
  per_minute: 5

# proxy: socks5://127.0.0.1:9050
