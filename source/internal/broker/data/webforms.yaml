brokers:
  - id: spokeo
    name: Spokeo
    domain: spokeo.com
    category: PEOPLE_SEARCH
    mechanism: WEB_FORM
    opt_out_url: https://www.spokeo.com/optout
    requires_captcha: true
    requires_email_confirmation: true
    jurisdiction_coverage: ALL
    repopulation_period_days: 45
    playbook: |
      Open the opt-out URL. Search your listing by name and city. Submit the
      published suppression form. Complete any challenge the site presents
      yourself. Watch the confirmation mailbox for a verify-click email.

  - id: whitepages
    name: Whitepages
    domain: whitepages.com
    category: PEOPLE_SEARCH
    mechanism: WEB_FORM
    opt_out_url: https://www.whitepages.com/suppression-requests
    requires_captcha: true
    requires_email_confirmation: true
    jurisdiction_coverage: ALL
    repopulation_period_days: 60
    playbook: |
      Use the suppression-request page. Identify the exact listing URL first.
      Whitepages typically emails a confirmation link that must be opened from
      the inbox you control.

  - id: radaris
    name: Radaris
    domain: radaris.com
    category: PEOPLE_SEARCH
    mechanism: WEB_FORM
    opt_out_url: https://radaris.com/control/privacy
    requires_email_confirmation: true
    jurisdiction_coverage: ALL
    repopulation_period_days: 60
    playbook: |
      Open the privacy control page, locate your record, and submit the
      removal request. Confirm via email if prompted.

  - id: fastpeoplesearch
    name: FastPeopleSearch
    domain: fastpeoplesearch.com
    category: PEOPLE_SEARCH
    mechanism: WEB_FORM
    opt_out_url: https://www.fastpeoplesearch.com/removal
    requires_captcha: true
    jurisdiction_coverage: ALL
    repopulation_period_days: 45
    playbook: |
      Paste the exact profile URL into the removal form. Complete the site's
      own verification steps. Recheck in 45 days; this class of site
      re-ingests public records frequently.

  - id: truepeoplesearch
    name: TruePeopleSearch
    domain: truepeoplesearch.com
    category: PEOPLE_SEARCH
    mechanism: WEB_FORM
