name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: source/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: make build
        if: runner.os != 'Windows'
        working-directory: .
        run: make build
      - name: make build, windows layout
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          make build GOOS=windows
          test -f bin/NullTrace.exe && test -f bin/app/nulltrace.exe && test -f bin/app/nulltraced.exe
